[package]
name = "kuira-crypto-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]  # lib for tests, staticlib for Android, cdylib for JNI

[dependencies]
# Midnight ledger libraries (from local midnight-libraries repo)
# Path: 4 levels up from kuira-crypto-ffi → android/Development, then into midnight/
midnight-zswap = { path = "./midnight-ledger/zswap" }
midnight-serialize = { path = "./midnight-ledger/serialize" }
midnight-ledger = { path = "./midnight-ledger/ledger" }
midnight-base-crypto = { path = "./midnight-ledger/base-crypto" }
midnight-storage = { path = "./midnight-ledger/storage" }
midnight-coin-structure = { path = "./midnight-ledger/coin-structure" }
midnight-transient-crypto = { path = "./midnight-ledger/transient-crypto" }

# Phase 6: Contract runtime (onchain-runtime for QueryContext.query)
midnight-onchain-runtime = { path = "./midnight-ledger/onchain-runtime" }
midnight-onchain-vm = { path = "./midnight-ledger/onchain-vm" }
midnight-onchain-state = { path = "./midnight-ledger/onchain-state" }

# Phase 4C: Local ZK Proving
midnight-zkir = { path = "./midnight-ledger/zkir" }
tokio = { version = "1", features = ["rt"] }

# Proving parallelism (already in the dependency tree transitively via the proving
# crates). Declared directly so the FFI can cap the global pool and leave a CPU core
# for the UI thread during local proving (#288).
rayon = "1.11"

# For state handle pool
once_cell = "1.19"

# For hex encoding
hex = "0.4"

# Supplies BIP-340's aux_rand during signing. NOT the nonce itself — the nonce is
# derived from the private key and the message. See the NONCE SAFETY note in
# src/transaction_ffi.rs before changing how randomness is used here.
rand = "0.8"

# For secure memory zeroization
zeroize = "1.8"

# For JSON parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For Android logging
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
log = "0.4"

[dev-dependencies]
# Ledger test harness — gives us TestState / reward_night / apply helpers so
# `well_formed()` reproduction tests don't have to hand-roll a LedgerState.
# Only pulled in for `cargo test`; production builds (staticlib / cdylib / lib)
# are unaffected.
midnight-ledger = { path = "./midnight-ledger/ledger", features = ["test-utilities"] }
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
opt-level = 3        # Maximum optimization
lto = true           # Link-time optimization for smaller binaries
codegen-units = 1    # Better optimization (slower compile)
strip = true         # Strip symbols for smaller size

[profile.dev]
# Line-tables only instead of full debuginfo (the cargo default for dev).
# Backtraces still resolve to file:line, but the heavy ZK/crypto deps
# (midnight-ledger workspace) stop emitting full symbol tables — which
# is what bloated target/debug into tens of GB. Applies to path deps too,
# since this crate is the build root.
debug = 1
