[package]
name = "kuira-crypto-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]  # lib for tests, staticlib for Android, cdylib for JNI

[dependencies]
# Midnight ledger libraries (from local midnight-libraries repo)
# Path: 4 levels up from kuira-crypto-ffi → android/Development, then into midnight/
midnight-zswap = { path = "../../../../midnight/midnight-libraries/midnight-ledger/zswap" }
midnight-serialize = { path = "../../../../midnight/midnight-libraries/midnight-ledger/serialize" }
midnight-ledger = { path = "../../../../midnight/midnight-libraries/midnight-ledger/ledger" }
midnight-base-crypto = { path = "../../../../midnight/midnight-libraries/midnight-ledger/base-crypto" }
midnight-storage = { path = "../../../../midnight/midnight-libraries/midnight-ledger/storage" }
midnight-coin-structure = { path = "../../../../midnight/midnight-libraries/midnight-ledger/coin-structure" }
midnight-transient-crypto = { path = "../../../../midnight/midnight-libraries/midnight-ledger/transient-crypto" }

# Phase 4C: Local ZK Proving
midnight-zkir = { path = "../../../../midnight/midnight-libraries/midnight-ledger/zkir" }
tokio = { version = "1", features = ["rt"] }

# For hex encoding
hex = "0.4"

# For randomness in signing (nonce generation)
rand = "0.8"

# For secure memory zeroization
zeroize = "1.8"

# For JSON parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For Android logging
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
log = "0.4"

[profile.release]
opt-level = 3        # Maximum optimization
lto = true           # Link-time optimization for smaller binaries
codegen-units = 1    # Better optimization (slower compile)
strip = true         # Strip symbols for smaller size
